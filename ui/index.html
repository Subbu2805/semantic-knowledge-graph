<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKG Explorer - Semantic Knowledge Graph</title>
<style>
  :root { --bg:#0f172a; --panel:#111c33; --line:#22314f; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --pos:#22c55e; --neg:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  aside { width:330px; border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); flex-shrink:0; }
  aside h1 { font-size:18px; margin:0; padding:18px 18px 4px; }
  aside p.sub { margin:0; padding:0 18px 12px; color:var(--muted); font-size:12px; }
  .domain { padding:10px 18px 4px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); display:flex; justify-content:space-between; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; margin-top:4px; }
  .dot.up { background:var(--pos); } .dot.down { background:var(--neg); }
  .case { padding:8px 18px; cursor:pointer; border-left:3px solid transparent; color:var(--text); }
  .case:hover { background:#16233f; } .case.active { border-left-color:var(--accent); background:#16233f; }
  main { flex:1; overflow-y:auto; padding:22px 28px; }
  h2 { margin:0 0 6px; font-size:20px; } .desc { color:var(--muted); margin:0 0 14px; max-width:900px; }
  .row { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  select, button, textarea { font:inherit; color:var(--text); background:#0b1324; border:1px solid var(--line); border-radius:6px; }
  select, button { padding:6px 10px; } button { background:var(--accent); color:#04263a; font-weight:600; cursor:pointer; border:none; }
  textarea { width:100%; height:170px; padding:10px; font-family:ui-monospace, Menlo, monospace; font-size:12.5px; }
  .meta { color:var(--muted); font-size:12px; } .err { color:var(--neg); white-space:pre-wrap; }
  .node { margin:12px 0 4px; } .node > .type { font-weight:600; color:var(--accent); margin-bottom:4px; }
  table { border-collapse:collapse; width:100%; max-width:1000px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num { font-variant-numeric:tabular-nums; width:110px; }
  .bar { position:relative; height:8px; width:160px; background:#1e293b; border-radius:4px; overflow:hidden; }
  .bar span { position:absolute; top:0; height:100%; }
  .nested { padding-left:22px; border-left:2px solid var(--line); margin:4px 0 8px 6px; }
</style>
</head>
<body>
<aside>
  <h1>SKG Explorer</h1>
  <p class="sub">Real-world use cases for the Semantic Knowledge Graph</p>
  <div id="cases"></div>
</aside>
<main>
  <h2 id="title">Loading...</h2>
  <p class="desc" id="desc"></p>
  <div class="row">
    <label class="meta" for="core">Core</label>
    <select id="core"><option>jobs</option><option>ecommerce</option><option>healthcare</option><option>support</option><option>knowledge-graph</option></select>
    <button id="run">Run query</button>
    <span class="meta" id="timing"></span>
  </div>
  <textarea id="request" spellcheck="false" aria-label="Request JSON"></textarea>
  <div id="results"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let cases = [];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function bar(r) {
  const w = Math.min(Math.abs(r), 1) * 50;
  const style = r >= 0 ? `left:50%;width:${w}%;background:var(--pos)` : `right:50%;width:${w}%;background:var(--neg)`;
  return `<div class="bar"><span style="${style}"></span></div>`;
}

function renderNodes(nodes) {
  return (nodes || []).map(n => `
    <div class="node"><div class="type">${esc(n.type)}</div>
    <table><tr><th>Value</th><th>Relatedness</th><th></th><th>Popularity</th><th>Foreground</th><th>Background</th></tr>
    ${(n.values || []).map(v => `
      <tr><td>${esc(v.name)}</td><td class="num">${v.relatedness.toFixed(4)}</td><td>${bar(v.relatedness)}</td>
      <td class="num">${v.popularity ?? ''}</td><td class="num">${v.foreground_popularity}</td><td class="num">${v.background_popularity}</td></tr>
      ${v.compare ? `<tr><td colspan="6"><div class="nested">${renderNodes(v.compare)}</div></td></tr>` : ''}`).join('')}
    </table></div>`).join('');
}

function select(c) {
  document.querySelectorAll('.case').forEach(el => el.classList.toggle('active', el.dataset.id === c.id));
  $('title').textContent = c.title;
  $('desc').textContent = c.description;
  $('core').value = c.core;
  $('request').value = JSON.stringify(c.request, null, 2);
  history.replaceState(null, '', '#' + c.id);
  run();
}

async function run() {
  let body;
  try { body = JSON.stringify(JSON.parse($('request').value)); }
  catch (e) { $('results').innerHTML = `<p class="err">Invalid JSON: ${esc(e.message)}</p>`; return; }
  $('results').innerHTML = '<p class="meta">Running...</p>';
  const t = performance.now();
  try {
    const resp = await fetch(`api/${$('core').value}/rel`, {method:'POST', headers:{'Content-Type':'application/json'}, body});
    const json = await resp.json();
    $('timing').textContent = `${(performance.now() - t).toFixed(0)} ms`;
    $('results').innerHTML = json.error ? `<p class="err">${esc(json.error.msg)}</p>` : renderNodes(json.data);
  } catch (e) {
    $('results').innerHTML = `<p class="err">Request failed: ${esc(e.message)}</p>`;
  }
}

async function health(core, dot) {
  try { const r = await fetch(`api/${core}/ping`); dot.className = 'dot ' + (r.ok ? 'up' : 'down'); }
  catch { dot.className = 'dot down'; }
}

(async () => {
  cases = (await (await fetch('catalog.json')).json()).use_cases;
  const byDomain = {};
  cases.forEach(c => (byDomain[c.domain] = byDomain[c.domain] || []).push(c));
  for (const [domain, list] of Object.entries(byDomain)) {
    const head = document.createElement('div');
    head.className = 'domain';
    head.innerHTML = `<span>${esc(domain)} <span class="meta">(${esc(list[0].core)})</span></span><span class="dot" title="core health"></span>`;
    $('cases').appendChild(head);
    health(list[0].core, head.querySelector('.dot'));
    list.forEach(c => {
      const el = document.createElement('div');
      el.className = 'case'; el.dataset.id = c.id; el.textContent = c.title;
      el.onclick = () => select(c);
      $('cases').appendChild(el);
    });
  }
  $('run').onclick = run;
  $('request').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run(); });
  select(cases.find(c => '#' + c.id === location.hash) || cases[0]);
})();
</script>
</body>
</html>
